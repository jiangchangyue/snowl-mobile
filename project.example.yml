project:
  name: snowl-mobile-demo
  run_name: demo_run
  description: Builtin stub adapter dry-run example for snowl-mobile.

models:
  - id: dummy_text_model
    provider: openai
    api_style: openai_chat
    modalities: [text]
    supports_image_input: false
    supports_tool_calling: false
    supports_json_mode: false
    rate_limit_profile:
      requests_per_minute: "120"
  - id: dummy_vision_model
    provider: openai
    api_style: openai_chat
    modalities: [text, image]
    supports_image_input: true
    supports_tool_calling: false
    supports_json_mode: true
    rate_limit_profile:
      requests_per_minute: "60"

agents:
  - id: dummy_text_agent
    display_name: Dummy Text Agent
    variant: default
    model_ref: dummy_text_model
    integration_mode: native
    required_modalities: [text]
    supported_modalities: [text]
    supported_model_protocols: [openai_chat]
    supports_tool_calling: false
    supports_image_input: false
    supports_json_mode: false
    requires_tool_calling: false
    requires_json_mode: false
    required_env: []
    action_schema: dummy_text_action_v1
    prompt_contract_version: dummy.v1
    worker_mode: in_process
    supported_benchmarks: [dummy_benchmark]
  - id: dummy_vision_agent
    display_name: Dummy Vision Agent
    variant: default
    model_ref: dummy_vision_model
    integration_mode: hybrid
    required_modalities: [text, image]
    supported_modalities: [text, image]
    supported_model_protocols: [openai_chat]
    supports_tool_calling: false
    supports_image_input: true
    supports_json_mode: true
    requires_tool_calling: false
    requires_json_mode: true
    required_env: []
    action_schema: dummy_vision_action_v1
    prompt_contract_version: dummy.v1
    worker_mode: venv
    supported_benchmarks: [dummy_benchmark]

benchmarks:
  - id: dummy_benchmark
    display_name: Dummy Benchmark
    integration_mode: wrap
    task_source:
      kind: inline
      selector: default
    metric_schema:
      primary: task_success
      native: [task_success, step_count]
    scorer_ref: dummy.native
    reset_policy: snapshot_then_seed
    reset_requirements:
      baseline_snapshot: clean-base
      requires_task_seed: true
    device_backend: adb_appium
    required_env: []
    supported_agent_ids: [dummy_text_agent, dummy_vision_agent]

pair_runtime_recipes:
  - recipe_id: dummy_vision_bridge_recipe
    agent_id: dummy_vision_agent
    benchmark_id: dummy_benchmark
    bridge_id: dummy_vision__dummy_benchmark
    requires_bridge: true
    worker_mode: container
    env_isolation: container
    control_backend: adb_appium
    reset_policy: snapshot_then_seed
    backend_requirements: [adb_appium, bridge_runtime]
    required_env: [DUMMY_BRIDGE_ENABLED]
    env_vars:
      DUMMY_BRIDGE_MODE: enabled
    ports:
      bridge_port: 51001
      bridge_metrics: 51002
    launch_hints:
      handshake: dummy.bridge.handshake
      run_entry: dummy.bridge.run_trial

matrix:
  expand: agent_x_benchmark
  seeds: [seed-0001]

runtime:
  batch_size: 2
  default_worker_mode: venv
  observation_mode: image_text
  env_isolation: per_worker_venv
  max_steps: 30
  timeout_sec: 900

devices:
  device_mode: fake
  emulator_profiles:
    - id: api34_base
      base_avd_name: Pixel_6_API_34
      platform: android
      api_level: 34
      system_image: android-34/google_apis/x86_64
      snapshot_name: clean-base
      screen_size: 1080x2400
      tags: [baseline, stable]
  default_profile: api34_base
  control_backend: adb_appium

reset:
  name: snapshot_then_seed
  scope: trial
  baseline_snapshot: clean-base
  allow_benchmark_seed: true
  healthcheck_timeout_sec: 120

retries:
  max_trial_retries: 2
  max_step_retries: 1
  backoff_sec: 3
  retry_on:
    - MODEL_API_ERROR
    - DEVICE_CONNECTION_ERROR
    - EMULATOR_CRASH
    - TIMEOUT_ERROR

artifacts:
  level: standard
  root_dir: runs/
  persist_step_artifacts: true
  persist_logs: true
  persist_prompt_payloads: false

monitoring:
  cli_live_panel: true
  web_viewer: false
