project:
  name: androidworld-minimal
  run_name: androidworld-minimal
  description: Minimal AndroidWorld benchmark integration config for registry, validate-config, plan, and dry-run.

models:
  - id: dummy_text_model
    provider: openai
    api_style: openai_chat
    modalities: [text]
    supports_image_input: false
    supports_tool_calling: false
    supports_json_mode: false

agents:
  - id: dummy_text_agent
    display_name: Dummy Text Agent
    variant: default
    model_ref: dummy_text_model
    integration_mode: native
    required_modalities: [text]
    supported_modalities: [text]
    supported_model_protocols: [openai_chat]
    supports_tool_calling: false
    supports_image_input: false
    supports_json_mode: false
    requires_tool_calling: false
    requires_json_mode: false
    required_env: []
    action_schema: dummy_text_action_v1
    prompt_contract_version: dummy.v1
    worker_mode: in_process
    supported_backends: [adb]
    supported_benchmarks: [androidworld]

benchmarks:
  - id: androidworld
    display_name: AndroidWorld
    integration_mode: hybrid
    task_source:
      kind: reference_repo
      path: references/benchmarks/android_world
      selector: all
      manifest: android_world/registry.py
    metric_schema:
      primary: task_success
      native: [task_success, episode_length, env_reward]
    scorer_ref: androidworld.native
    reset_policy: benchmark_native_reset
    reset_requirements:
      requires_existing_emulator: true
      requires_grpc_emulator: true
      upstream_setup_entry: android_world/env/env_launcher.py::load_and_setup_env
      upstream_reset_entry: android_world/env/interface.py::AsyncEnv.reset
    device_backend: adb
    required_env: [ANDROID_SDK_ROOT, ANDROID_WORLD_HOME]
    supported_agent_ids: [dummy_text_agent]
    options:
      suite_family: android
      perform_emulator_setup: false
      tasks: [SimpleSmsSend]
      n_task_combinations: 1
      task_random_seed: 30
      fixed_task_seed: false
      checkpoint_dir: ""
      output_path: ""
      adb_path: ""
      console_port: 5554
      grpc_port: 8554
      freeze_datetime: true
      python_executable: ""
      requirements_file: references/benchmarks/android_world/requirements.txt
      worker_env_name: androidworld

matrix:
  expand: agent_x_benchmark
  seeds: [seed-0001]

runtime:
  batch_size: 1
  default_worker_mode: in_process
  observation_mode: benchmark_native
  env_isolation: per_worker_venv
  max_steps: 20
  timeout_sec: 1200

devices:
  emulator_profiles:
    - id: androidworld_api33
      base_avd_name: AndroidWorldAvd
      platform: android
      api_level: 33
      system_image: android-33/google_apis/x86_64
      snapshot_name: androidworld_base
      screen_size: 1080x2400
      grpc_port: 8554
      tags: [androidworld, baseline]
  default_profile: androidworld_api33
  control_backend: adb

reset:
  name: benchmark_native_reset
  scope: trial
  baseline_snapshot: androidworld_base
  allow_benchmark_seed: true
  healthcheck_timeout_sec: 120

retries:
  max_trial_retries: 0
  max_step_retries: 0
  backoff_sec: 0
  retry_on: []

artifacts:
  level: light
  root_dir: runs/
  persist_step_artifacts: false
  persist_logs: true
  persist_prompt_payloads: false

monitoring:
  cli_live_panel: false
  web_viewer: false
