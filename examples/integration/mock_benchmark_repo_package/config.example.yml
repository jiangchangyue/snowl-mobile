project:
  name: mock_benchmark_repo-integration-demo
  run_name: mock_benchmark_repo-smoke
  description: >
    TODO: fill this config after wiring the real benchmark adapter and a compatible local agent.

models:
  - model_id: dummy_text_model
    provider: openai
    api_style: openai_chat
    modalities: [text]
    supports_image_input: false
    supports_tool_calling: false
    supports_json_mode: false

agents:
  - agent_id: dummy_text_agent
    model_ref: dummy_text_model
    integration_mode: native
    supported_modalities: [text]
    required_modalities: [text]
    supported_model_protocols: [openai_chat]

benchmarks:
  - benchmark_id: mock_benchmark_repo
    display_name: Mock Benchmark Repo
    integration_mode: wrap
    task_source:
      kind: reference_repo
      path: references/benchmarks/mock-benchmark-repo
      selector: tasks/tasks.json
      manifest: tasks/tasks.json
    metric_schema:
      primary_metric: task_success
      native_metrics: [TODO_native_metric]
    scorer_ref: scorer.py
    reset_policy: reset_env.py
    reset_requirements:
      requires_task_seed: false
    device_backend: adb_appium
    required_env: []

matrix:
  expand: agent_x_benchmark
  seeds: [seed-0001]

runtime:
  batch_size: 1
  timeout_sec: 900
  max_steps: 30
  env_isolation: per_worker_venv

devices:
  default_profile: api34_base

retries:
  max_trial_retries: 1

artifacts:
  level: standard
