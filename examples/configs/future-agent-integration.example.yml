project:
  name: future-agent-integration-demo
  run_name: future-agent-smoke
  description: Example config for a future agent integration after a user clones an agent repo into references/agents/.

models:
  - id: validation_vision_model
    provider: openai
    api_style: openai_chat
    modalities: [text, image]
    supports_image_input: true
    supports_tool_calling: false
    supports_json_mode: true

agents:
  - id: future_mock_agent
    display_name: Future Mock Agent
    variant: default
    model_ref: validation_vision_model
    integration_mode: hybrid
    required_modalities: [text, image]
    supported_modalities: [text, image]
    supported_model_protocols: [openai_chat]
    supports_tool_calling: false
    supports_image_input: true
    supports_json_mode: true
    requires_tool_calling: false
    requires_json_mode: false
    required_env: [FUTURE_AGENT_HOME]
    action_schema: future_agent_action_v1
    prompt_contract_version: future-agent.v1
    worker_mode: venv
    supported_benchmarks: [local_validation_benchmark]

benchmarks:
  - id: local_validation_benchmark
    display_name: Local Validation Benchmark
    integration_mode: wrap
    task_source:
      kind: inline
      selector: default
      path: ""
      manifest: ""
    metric_schema:
      primary: task_success
      native: [task_success]
    scorer_ref: local_validation_benchmark.native
    reset_policy: snapshot_then_seed
    reset_requirements:
      requires_task_seed: false
    device_backend: adb_appium
    required_env: []
    supported_agent_ids: [future_mock_agent]

matrix:
  expand: agent_x_benchmark
  seeds: [seed-0001]

runtime:
  batch_size: 1
  default_worker_mode: venv
  observation_mode: image_text
  env_isolation: per_worker_venv
  max_steps: 30
  timeout_sec: 900

devices:
  emulator_profiles:
    - id: api34_base
      base_avd_name: Pixel_6_API_34
      platform: android
      api_level: 34
      system_image: android-34/google_apis/x86_64
      snapshot_name: clean-base
      screen_size: 1080x2400
      tags: [baseline]
  default_profile: api34_base
  control_backend: adb_appium

reset:
  name: snapshot_then_seed
  scope: trial
  baseline_snapshot: clean-base
  allow_benchmark_seed: true
  healthcheck_timeout_sec: 120

retries:
  max_trial_retries: 1
  max_step_retries: 0
  backoff_sec: 3
  retry_on: [MODEL_API_ERROR, TIMEOUT_ERROR]

artifacts:
  level: standard
  root_dir: runs/
  persist_step_artifacts: true
  persist_logs: true
  persist_prompt_payloads: false

monitoring:
  cli_live_panel: true
  web_viewer: false
