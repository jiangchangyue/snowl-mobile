project:
  name: future-benchmark-integration-demo
  run_name: future-benchmark-smoke
  description: Example config for a future benchmark integration after a user clones a benchmark repo into references/benchmarks/.

models:
  - id: validation_text_model
    provider: openai
    api_style: openai_chat
    modalities: [text]
    supports_image_input: false
    supports_tool_calling: false
    supports_json_mode: false

agents:
  - id: local_validation_agent
    display_name: Local Validation Agent
    variant: default
    model_ref: validation_text_model
    integration_mode: wrap
    required_modalities: [text]
    supported_modalities: [text]
    supported_model_protocols: [openai_chat]
    supports_tool_calling: false
    supports_image_input: false
    supports_json_mode: false
    requires_tool_calling: false
    requires_json_mode: false
    required_env: []
    action_schema: validation_action_v1
    prompt_contract_version: validation.v1
    worker_mode: in_process
    supported_benchmarks: [future_mock_benchmark]

benchmarks:
  - id: future_mock_benchmark
    display_name: Future Mock Benchmark
    integration_mode: wrap
    task_source:
      kind: reference_repo
      path: references/benchmarks/future-mock-benchmark-repo
      selector: default
      manifest: tasks/manifest.json
    metric_schema:
      primary: task_success
      native: [task_success, latency_ms]
    scorer_ref: future_mock_benchmark.native
    reset_policy: snapshot_then_seed
    reset_requirements:
      requires_task_seed: true
    device_backend: adb_appium
    required_env: [FUTURE_BENCHMARK_HOME]
    supported_agent_ids: [local_validation_agent]

matrix:
  expand: agent_x_benchmark
  seeds: [seed-0001]

runtime:
  batch_size: 1
  default_worker_mode: venv
  observation_mode: image_text
  env_isolation: per_worker_venv
  max_steps: 40
  timeout_sec: 1200

devices:
  emulator_profiles:
    - id: api34_base
      base_avd_name: Pixel_6_API_34
      platform: android
      api_level: 34
      system_image: android-34/google_apis/x86_64
      snapshot_name: clean-base
      screen_size: 1080x2400
      tags: [baseline]
  default_profile: api34_base
  control_backend: adb_appium

reset:
  name: snapshot_then_seed
  scope: trial
  baseline_snapshot: clean-base
  allow_benchmark_seed: true
  healthcheck_timeout_sec: 120

retries:
  max_trial_retries: 1
  max_step_retries: 0
  backoff_sec: 3
  retry_on: [MODEL_API_ERROR, TIMEOUT_ERROR]

artifacts:
  level: standard
  root_dir: runs/
  persist_step_artifacts: true
  persist_logs: true
  persist_prompt_payloads: false

monitoring:
  cli_live_panel: true
  web_viewer: false
